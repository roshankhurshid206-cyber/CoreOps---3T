---
- name: Install Nginx web server
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Ensure Nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Deploy application index page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: "0644"

- name: Install MySQL client libraries
  ansible.builtin.apt:
    name:
      - default-mysql-client
      - python3-pymysql
    state: present

- name: Verify database connectivity from the compute tier
  ansible.builtin.command:
    cmd: "mysql -h {{ db_host }} -P {{ db_port }} -u {{ db_user }} -p{{ db_password }} -e 'SELECT 1;'"
  register: db_check
  changed_when: false
  failed_when: db_check.rc != 0
  when: db_host | length > 0
