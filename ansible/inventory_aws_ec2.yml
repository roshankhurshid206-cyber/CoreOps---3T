plugin: aws_ec2

aws_ec2:
  regions:
    - "{{ lookup('env', 'AWS_REGION') | default('us-east-1', true) }}"
  filters:
    tag:Project: "CoreOps-3T"
    tag:ManagedBy: "Terraform"
    tag:Role: "webserver"
  keyed_groups:
    - key: tags.Role
      prefix: role
  hostnames:
    - tag:Name
    - private-ip-address
  compose:
    ansible_host: private_ip_address
